<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brand Makers Preloader Preview</title>
    <style>
      :root {
        --brand-blue: #00a1e1;
        --logo-white: #ffffff;
        --preview-bg: var(--brand-blue);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
        background: var(--preview-bg);
      }

      .brandmakers-preloader {
        width: min(34vw, 220px);
        min-width: 112px;
        aspect-ratio: 1;
        animation: preloader-cycle-fade 3s linear infinite;
      }

      .brandmakers-preloader svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .logo-shape {
        fill: var(--logo-white);
      }

      .reveal-stroke {
        fill: none;
        stroke: #ffffff;
        stroke-width: 78;
        stroke-linecap: butt;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        opacity: 0;
      }

      .top-reveal {
        animation: draw-top 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .middle-reveal {
        animation: draw-middle 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .stem-reveal {
        animation: draw-stem 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes draw-top {
        0% {
          stroke-dashoffset: 1;
          opacity: 1;
        }

        34%,
        92% {
          stroke-dashoffset: 0;
          opacity: 1;
        }

        100% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }

      @keyframes draw-middle {
        0%,
        33.9% {
          stroke-dashoffset: 1;
          opacity: 0;
        }

        34% {
          stroke-dashoffset: 1;
          opacity: 1;
        }

        68%,
        92% {
          stroke-dashoffset: 0;
          opacity: 1;
        }

        100% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }

      @keyframes draw-stem {
        0%,
        67.9% {
          stroke-dashoffset: 1;
          opacity: 0;
        }

        68% {
          stroke-dashoffset: 1;
          opacity: 1;
        }

        90%,
        92% {
          stroke-dashoffset: 0;
          opacity: 1;
        }

        100% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }

      @keyframes preloader-cycle-fade {
        0%,
        92% {
          opacity: 1;
        }

        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="brandmakers-preloader" aria-label="Brand Makers loading">
      <svg viewBox="0 0 159.3 158.6" role="img" aria-hidden="true">
        <defs>
          <mask id="top-reveal-mask" maskUnits="userSpaceOnUse">
            <rect width="159.3" height="158.6" fill="#000000" />
            <path
              class="reveal-stroke top-reveal"
              pathLength="1"
              d="M6.9,22.3c69.9,0,55.5,0,89.8,0c47.2,0,49.4,57,0,57H48.9"
            />
          </mask>

          <mask id="middle-reveal-mask" maskUnits="userSpaceOnUse">
            <rect width="159.3" height="158.6" fill="#000000" />
            <path
              class="reveal-stroke middle-reveal"
              pathLength="1"
              d="M96.7,79.3c49.4,0,47.2,57,0,57c-34.3,0-47.8,0-47.8,0"
            />
          </mask>

          <mask id="stem-reveal-mask" maskUnits="userSpaceOnUse">
            <rect width="159.3" height="158.6" fill="#000000" />
            <line
              class="reveal-stroke stem-reveal"
              pathLength="1"
              x1="24.1"
              y1="152.3"
              x2="24.1"
              y2="46.7"
            />
          </mask>
        </defs>

        <g mask="url(#top-reveal-mask)">
          <path
            class="logo-shape"
            d="M6.9 38.3C6.9 20.63 21.23 6.3 38.9 6.3H96.7C128.95 6.3 146.1 25.1 146.1 50.8C146.1 76.5 128.85 95.3 96.7 95.3H80.7V63.3H96.7C117.35 63.3 117.35 38.3 96.7 38.3H6.9Z"
          />
          <path
            class="logo-shape"
            d="M48.9 63.3H100.8V95.3H48.9Z"
          />
        </g>

        <g mask="url(#middle-reveal-mask)">
          <path
            class="logo-shape"
            d="M48.9 152.3V120.3H96.7C117.35 120.3 117.35 95.3 96.7 95.3H48.9V63.3H100.8C132.9 63.3 146.1 84.8 146.1 108.8C146.1 133.7 128.95 152.3 96.7 152.3H48.9Z"
          />
        </g>

        <g mask="url(#stem-reveal-mask)">
          <path
            class="logo-shape"
            d="M7.1 46.7H41.1V152.3H41.1C22.32 152.3 7.1 137.08 7.1 118.3V46.7Z"
          />
        </g>
      </svg>
    </div>
  </body>
</html>
